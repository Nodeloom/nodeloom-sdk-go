name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Weekly re-scan so newly published Go vulnerabilities surface even when
    # the code has not changed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod's go directive is the minimum version consumers can build
        # with; test it alongside the two supported Go releases.
        go-version: ['go.mod', 'oldstable', 'stable']
    env:
      # Without this, the go command silently switches to the toolchain named
      # in go.mod and every matrix entry ends up testing the same version.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version != 'go.mod' && matrix.go-version || '' }}
          go-version-file: ${{ matrix.go-version == 'go.mod' && 'go.mod' || '' }}
          check-latest: true
      - run: go version
      - run: go vet ./...
      - run: go test -v -race ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
